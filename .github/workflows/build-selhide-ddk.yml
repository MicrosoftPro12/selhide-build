name: Build selhide DDK module

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI target
        required: true
        default: android16-6.12
        type: choice
        options:
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android14-5.15
          - android13-5.15
          - android12-5.4
      ddk_release:
        description: DDK image release tag suffix
        required: true
        default: "20260313"
        type: string
      source_dir:
        description: selhide source directory
        required: true
        default: selhide-popsicle
        type: string
      require_ddk:
        description: Require the ddk frontend instead of allowing Kbuild fallback
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      strip_btf:
        description: Remove .BTF/.BTF.ext from the produced module
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
  push:
    branches:
      - main
      - master
      - experiment
      - experimental
      - experimental/**

permissions:
  contents: read

jobs:
  ddk-build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.kmi != 'android12-5.4' }}
    name: Build ${{ github.event.inputs.kmi || 'android16-6.12' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ github.event.inputs.kmi || 'android16-6.12' }}-${{ github.event.inputs.ddk_release || '20260313' }}
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        shell: bash
        env:
          KMI: ${{ github.event.inputs.kmi || 'android16-6.12' }}
          DDK_TARGET: ${{ github.event.inputs.kmi || 'android16-6.12' }}
          SOURCE_DIR: ${{ github.event.inputs.source_dir || 'selhide-popsicle' }}
          REQUIRE_DDK: ${{ github.event.inputs.require_ddk || '0' }}
          STRIP_BTF: ${{ github.event.inputs.strip_btf || '1' }}
        run: |
          set -uo pipefail
          chmod +x ./build_selhide_ddk.sh
          mkdir -p out
          set +e
          (
            set -euxo pipefail
            SELHIDE_SRC="$PWD/$SOURCE_DIR" \
            OUTDIR="$PWD/out" \
            OUT_NAME="selhide-${KMI}.ko" \
            REQUIRE_DDK="$REQUIRE_DDK" \
            STRIP_BTF="$STRIP_BTF" \
            LOADER=/nonexistent \
            ./build_selhide_ddk.sh
          ) 2>&1 | tee out/build.log
          build_rc="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$build_rc" > out/build.exit
          exit "$build_rc"

      - name: Inspect and verify output
        shell: bash
        run: |
          set -euxo pipefail
          ls -la out
          for ko in out/*.ko; do
            echo "== $ko =="
            file "$ko" || true
            modinfo "$ko" || true
            strings "$ko" | grep -E '^(version|vermagic|parm|parmtype)=' || true
            readelf -sW "$ko" > "${ko}.symbols.txt"
            grep -E ' init_module$| cleanup_module$|__cfi_jt_init_module|__cfi_jt_cleanup_module|__cfi_check' \
              "${ko}.symbols.txt" || true
            if grep -q ' __cfi_check$' "${ko}.symbols.txt"; then
              grep -q ' __cfi_jt_init_module$' "${ko}.symbols.txt"
              grep -q ' __cfi_jt_cleanup_module$' "${ko}.symbols.txt"
            fi
            readelf -SW "$ko" | grep -E '(__versions|\.BTF)' || true
            if readelf -SW "$ko" | grep -qE '\.BTF'; then
              echo "unexpected BTF section left in $ko" >&2
              exit 1
            fi
            OBJDUMP="$(command -v llvm-objdump || command -v aarch64-linux-gnu-objdump || command -v objdump)"
            "$OBJDUMP" -dr "$ko" > "${ko}.objdump.txt"
            check_bti_entry() {
              local symbol="$1"
              local first_insn="${ko}.${symbol}.first-insn.txt"
              if ! grep -q "<${symbol}>:" "${ko}.objdump.txt"; then
                echo "missing expected indirect entry symbol: ${symbol}" >&2
                exit 1
              fi
              awk -v sym="<${symbol}>:" '
                index($0, sym) { found = 1; next }
                found && /^[[:space:]]*[[:xdigit:]]+:/ { print; exit }
              ' "${ko}.objdump.txt" > "$first_insn"
              cat "$first_insn"
              if ! grep -Eq 'hint[[:space:]]+#34|d503245f' "$first_insn"; then
                echo "missing BTI c landing pad at ${symbol}" >&2
                exit 1
              fi
            }
            # CFI-LTO builds expose this jump-table entry; KCFI/non-LTO builds
            # call selhide_real_init directly and legitimately omit it.
            if grep -q '<selhide_real_init.cfi_jt>:' "${ko}.objdump.txt"; then
              check_bti_entry 'selhide_real_init.cfi_jt'
            else
              echo "selhide_real_init.cfi_jt not emitted; direct init entry is expected"
            fi
            check_bti_entry 'selhide_write_access_entry'
            check_bti_entry 'selhide_patch_text_cb_entry'
            sed -n '/<selhide_write_access_impl>:/,/^$/p' "${ko}.objdump.txt" \
              > "${ko}.selhide_write_access_impl.txt"
            if grep -E 'paciasp|autiasp|hint[[:space:]]+#(25|29)|\\bx18\\b' "${ko}.selhide_write_access_impl.txt"; then
              echo "unexpected PAC/SCS instruction in selhide_write_access_impl" >&2
              exit 1
            fi
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selhide-${{ github.event.inputs.kmi || 'android16-6.12' }}
          path: |
            out/*.ko
            out/*.txt
            out/*.log
            out/*.exit
          if-no-files-found: error

  renoir-ack-build:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.kmi == 'android12-5.4') || (github.event_name == 'push' && github.ref == 'refs/heads/experiment' && contains(github.event.head_commit.message, '[renoir-ack]')) }}
    name: Build renoir android12-5.4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACK_URL: https://android.googlesource.com/kernel/common/+archive/refs/tags/android12-5.4.147_r00.tar.gz
      ACK_DIR: ${{ github.workspace }}/ack-android12-5.4.147
      SOURCE_DIR: ${{ github.event.inputs.source_dir || 'selhide-popsicle' }}
      RENOIR_CONFIG: configs/renoir-5.4.147-qgki-ga2bfd24da692.config
      OUT_NAME: selhide-renoir-android12-5.4.147-qgki.ko

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android 12 5.4 ACK tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ACK_DIR" out
          curl -L --fail --retry 5 --retry-delay 10 \
            "$ACK_URL" \
            -o out/kernel_common-android12-5.4.147_r00.tar.gz
          tar -xzf out/kernel_common-android12-5.4.147_r00.tar.gz -C "$ACK_DIR"
          if [ ! -f "$ACK_DIR/Makefile" ]; then
            nested="$(find "$ACK_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -z "$nested" ] || [ ! -f "$nested/Makefile" ]; then
              echo "could not locate extracted ACK Makefile" >&2
              find "$ACK_DIR" -maxdepth 2 -type f -name Makefile -print >&2
              exit 1
            fi
            shopt -s dotglob
            mv "$nested"/* "$ACK_DIR"/
            rmdir "$nested"
          fi
          cp "$RENOIR_CONFIG" "$ACK_DIR/.config"
          make -C "$ACK_DIR" ARCH=arm64 LLVM=1 olddefconfig prepare modules_prepare \
            2>&1 | tee out/renoir-kernel-prepare.log

      - name: Build renoir module
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./build_selhide_ddk.sh
          set +e
          (
            set -euxo pipefail
            SELHIDE_SRC="$PWD/$SOURCE_DIR" \
            OUTDIR="$PWD/out" \
            OUT_NAME="$OUT_NAME" \
            KMI=android12-5.4 \
            DDK_TARGET=android12-5.4 \
            KDIR="$ACK_DIR" \
            FORCE_MAKE=1 \
            LLVM=1 \
            STRIP_BTF="${STRIP_BTF:-1}" \
            LOADER=/nonexistent \
            ./build_selhide_ddk.sh
          ) 2>&1 | tee out/renoir-build.log
          build_rc="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$build_rc" > out/renoir-build.exit
          exit "$build_rc"

      - name: Inspect renoir output
        shell: bash
        run: |
          set -euxo pipefail
          ls -la out
          ko="out/$OUT_NAME"
          file "$ko" || true
          modinfo "$ko" || true
          strings "$ko" | grep -E '^(version|vermagic|parm|parmtype)=' | tee out/renoir-modinfo-strings.txt
          readelf -sW "$ko" > "out/$OUT_NAME.symbols.txt"
          grep -E ' init_module$| cleanup_module$|__cfi_jt_init_module|__cfi_jt_cleanup_module|__cfi_check' \
            "out/$OUT_NAME.symbols.txt" || true
          if grep -q ' __cfi_check$' "out/$OUT_NAME.symbols.txt"; then
            grep -q ' __cfi_jt_init_module$' "out/$OUT_NAME.symbols.txt"
            grep -q ' __cfi_jt_cleanup_module$' "out/$OUT_NAME.symbols.txt"
          fi
          readelf -SW "$ko" | grep -E '(__versions|\.BTF)' || true
          if readelf -SW "$ko" | grep -qE '\.BTF'; then
            echo "unexpected BTF section left in $ko" >&2
            exit 1
          fi
          grep -q '^vermagic=5\.4\.147-qgki-ga2bfd24da692 ' out/renoir-modinfo-strings.txt

      - name: Upload renoir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selhide-renoir-android12-5.4.147-qgki
          path: |
            out/*.ko
            out/*.txt
            out/*.log
            out/*.exit
          if-no-files-found: error
